name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT `RUSTFLAGS: -D warnings`, which is where this used to be.
  #
  # RUSTFLAGS applies to **every crate compiled, dependencies included**. So a warning introduced by
  # a new compiler in wgpu, winit, or anything else fails this project's CI for something nobody
  # here can fix, and the failure looks like our bug. It also silently invalidates the build cache
  # whenever it changes.
  #
  # Our own code is still warnings-as-errors: the `check` job passes `-D warnings` to clippy over
  # `--all-targets --all-features`, and every crate opts into the workspace lint table
  # (`[lints] workspace = true`). Nothing is lost except failures we cannot act on.

jobs:
  check:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target (ADR 0002). Linux is included as a cheap cross-check that
        # nothing has quietly grown a platform assumption -- worth catching now rather than at M5
        # when web and other targets arrive.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cpal`, underneath kira, links against ALSA on Linux and needs its headers to build at all.
      # This is a *build* requirement, not a runtime one -- the runner still has no sound card, and
      # nothing here plays anything. `games/atrium` enables `amadeo-audio/kira`, so feature
      # unification means the whole workspace build wants it whether or not `--all-features` is
      # passed.
      - name: ALSA headers (Linux only, for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests
        run: cargo test --workspace --all-features

  determinism:
    name: determinism (repeat runs must agree)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Invariant I3 says the same inputs produce the same state. A single test run cannot show
      # that -- it would pass even if results varied between runs. Running the suite repeatedly in
      # separate processes catches nondeterminism that comes from address-space layout, hash seeds,
      # or iteration order, which is exactly the class of bug that silently voids golden replays.
      # Deliberately NOT --all-features: this job is about simulation determinism, which the GPU
      # backend cannot affect (it is a Service and excluded from the state hash, ADR 0009).
      #
      # ⚠️ THIS DOES NOT MEAN THE GPU TESTS DO NOT RUN. Cargo unifies features across a build, and
      # `--workspace` includes quad-demo and vault, which enable `amadeo-render/gpu` — so the whole
      # build gets it and `tests/capture.rs` runs here too. The comment that used to sit here claimed
      # otherwise and was simply wrong; it cost a CI failure to find out.
      #
      # `--test-threads=1` is therefore load-bearing rather than tidy: wgpu#6571 crashes when one
      # headless device is dropped while another is alive, which is what parallel GPU tests do. The
      # tests also take a lock of their own now, so this is belt and braces.
      - name: Run the suite three times in separate processes
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "--- attempt $attempt ---"
            cargo test --workspace -- --test-threads=1
          done

      # Debug and release builds must agree too. A mismatch usually means a float optimisation or an
      # overflow check is changing behaviour, both of which break replay portability.
      #
      # `--test-threads=1` matches the debug runs above. It was missing, and that asymmetry is the
      # whole reason this job failed while the three runs three steps earlier passed on the same
      # code — see the note above.
      - name: Release build must agree with debug
        run: cargo test --workspace --release -- --test-threads=1

      # The SEPARATE-PROCESS half of the golden-replay mechanism, and the last item carried over
      # from M0's exit gate. The in-process test in amadeo-app proves a recording survives a
      # rebuild; this proves it survives a fresh process, which is the stronger claim -- it is the
      # one that catches nondeterminism coming from process state rather than from code.
      #
      # It also exercises the whole ADR 0016 path end to end: the CLI launches the game binary,
      # speaks JSON-RPC to it over stdio, and reports what it hears back.
      - name: Replay a recording in a separate process
        shell: bash
        run: |
          # Built and then invoked by path rather than `cargo run`, so the CLI's own
          # `cargo run -p quad-demo` is not nested inside a cargo invocation holding the build lock.
          # `.exe` is explicit because this job is windows-only.
          cargo build --package amadeo-cli
          ./target/debug/amadeo.exe replay games/quad-demo/replays/wander.replay
          # The Vault is M1's exit-gate game, and a much stronger determinism check than quad-demo:
          # patrolling wardens, collision against forty-four walls, entities despawning mid-run, and
          # a resource changing as a result. Every one of those is a place nondeterminism could hide.
          ./target/debug/amadeo.exe replay games/vault/replays/collect-three.replay --package vault

      # The scene file is the level (invariant I1), so a typo in it is a broken game rather than a
      # broken test. `check` validates it against the game's *real* component schema, which is the
      # thing a standalone linter could never do (ADR 0016).
      #
      # The prefabs are checked too, and separately: an instance only names its prefab by id, so a
      # scene can be entirely valid while the prefab behind it is not.
      - name: Validate the Vault's scenes against its real schema
        shell: bash
        run: |
          ./target/debug/amadeo.exe check games/vault/scenes/vault.scene --package vault
          ./target/debug/amadeo.exe check games/vault/assets/prefabs/sigil_pickup.scene --package vault
          ./target/debug/amadeo.exe check games/vault/assets/prefabs/floor_trap.scene --package vault
          # A material, an environment and a mesh are all scene files with one root (ADRs 0033-0035),
          # so `check` validates them against the real schema exactly as it does a level. That claim
          # was false until the Vault registered the types it ships assets for -- found by running it.
          ./target/debug/amadeo.exe check games/vault/assets/looks/corridor_dark.environment --package vault
          ./target/debug/amadeo.exe check games/vault/assets/meshes/wall_panel.mesh --package vault

      # Every one of the Atrium's files, and the asset files are the point rather than the level.
      #
      # Three of its materials were missing a required field. Nothing failed: `load_materials` skips
      # an asset that will not parse, so all eleven meshes drew with the default white material and
      # the room came out looking like an untextured grey box. `check` says exactly which field is
      # missing in which file -- it just had never been pointed at them, because only the *level* was
      # in this list. A validator nobody runs is a validator that does not exist.
      - name: Validate the Atrium's level and every asset it ships
        shell: bash
        run: |
          ./target/debug/amadeo.exe check games/atrium/scenes/atrium.scene --package atrium
          for asset in games/atrium/assets/meshes/*.mesh \
                       games/atrium/assets/materials/*.material \
                       games/atrium/assets/looks/*.environment; do
            ./target/debug/amadeo.exe check "$asset" --package atrium
          done

      # The Scarp, on the same terms. Its level authors only a sun, a player and a camera -- the
      # ground is generated -- so the asset files carry proportionally more of it than the scene does.
      - name: Validate the Scarp's level and every asset it ships
        shell: bash
        run: |
          ./target/debug/amadeo.exe check games/scarp/scenes/scarp.scene --package scarp
          for asset in games/scarp/assets/meshes/*.mesh \
                       games/scarp/assets/materials/*.material \
                       games/scarp/assets/looks/*.environment; do
            ./target/debug/amadeo.exe check "$asset" --package scarp
          done

      # The first automated coverage the GPU path has ever had. `render.describe` checks what *should*
      # be drawn; this renders offscreen and asserts on the pixels that came back.
      #
      # Not part of `cargo test --workspace`, because that does not enable the `gpu` feature. If the
      # runner has no adapter at all the tests say so and pass — a missing GPU is a fact about the
      # machine, not about the engine — so this can never be a flaky failure, only a quiet one.
      - name: The GPU actually drew what it was asked to
        shell: bash
        run: cargo test -p amadeo-render --features gpu --test capture -- --nocapture

      # The same thing end to end, through a real game binary over JSON-RPC: the CLI launches the
      # Vault headless, the game opens an offscreen GPU, renders, encodes a PNG, and writes it.
      # A runner with no adapter fails this rather than skipping, which is the right way round —
      # unlike the unit tests above, reaching here means the whole path was expected to work.
      - name: A game captures itself with no window
        shell: bash
        run: |
          ./target/debug/amadeo.exe capture --package vault --ticks 60 --width 320 --height 180 ci-shot.png
          test -s ci-shot.png
          rm ci-shot.png

      # ADR 0030: the point of `--example` is that what it emits actually loads. The unit tests cover
      # every engine component; this covers the whole path end to end, through a real game binary
      # over JSON-RPC, on a type whose enum field is the thing no schema could have taught.
      - name: A generated example loads
        shell: bash
        run: |
          ./target/debug/amadeo.exe describe Run --package vault --example > example.json
          grep -q 'phase Playing' example.json
          rm example.json

      # Invariant I2 applies to hand-written scene files exactly as `cargo fmt` applies to code, and
      # nothing was enforcing it -- all three of these files were found non-canonical in session 8,
      # with components out of sorted order. `fmt` is standalone (ADR 0016) so this needs no game.
      - name: Scene files are canonically formatted
        shell: bash
        run: |
          ./target/debug/amadeo.exe fmt --check \
            games/vault/scenes/vault.scene \
            games/vault/assets/prefabs/sigil_pickup.scene \
            games/vault/assets/prefabs/floor_trap.scene \
            games/quad-demo/scenes/markers.scene \
            games/vault/assets/looks/corridor_dark.environment \
            games/vault/assets/meshes/wall_panel.mesh \
            games/atrium/scenes/atrium.scene \
            games/atrium/assets/looks/atrium.environment \
            games/atrium/assets/meshes/*.mesh \
            games/atrium/assets/materials/*.material \
            games/scarp/scenes/scarp.scene \
            games/scarp/assets/looks/scarp.environment \
            games/scarp/assets/meshes/*.mesh \
            games/scarp/assets/materials/*.material

  docs:
    name: docs build without warnings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Doc comments are the agent's primary API surface (docs/03-ai-native-design.md Pillar 2), so
      # a broken intra-doc link is a real defect rather than cosmetic.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
