[package]
name = "atrium"
description = "M2's demo: a lit 3D room with shadows and a character you walk around in."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# Two binaries now, so `cargo run -p atrium` would otherwise be ambiguous and every CLI command
# against this game would fail with it. `games/vault` learned this the same way.
default-run = "atrium"

[dependencies]
amadeo-anim.workspace = true
# The watcher's mind (ADR 0068). The module sequences named states; this game says what the facts
# mean and what the states do.
amadeo-behaviour.workspace = true
amadeo-app = { workspace = true, features = ["gpu"] }
# `kira` on, deliberately and not by default elsewhere -- the same trade this file already makes for
# rapier one entry down. A demo of the audio system that makes no sound is not a demo, and the only
# verification audio has is a person hearing it. Feature unification means this builds cpal for
# `cargo test --workspace` too, and on Linux that needs ALSA's headers; CI installs them.
amadeo-audio = { workspace = true, features = ["kira"] }
amadeo-core.workspace = true
amadeo-ecs.workspace = true
# A footstep is an event, not a state (ADR 0059). This game is what sends them.
amadeo-events.workspace = true
amadeo-input.workspace = true
# The whole point of this game: the module walks, and the renderer draws its shadow.
amadeo-camera.workspace = true
amadeo-character.workspace = true
# `rapier` on, deliberately and not by default elsewhere. Against `NullPhysics` the character walks
# through the walls -- which is a *useful* control case in a test and a broken one in a demo somebody
# is looking at. Feature unification means this turns rapier on for `cargo test --workspace` too;
# that is real CI build time, and it is the price of the demo being the thing it claims to be.
amadeo-physics = { workspace = true, features = ["rapier"] }
amadeo-reflect.workspace = true
amadeo-render = { workspace = true, features = ["gpu"] }
amadeo-scene.workspace = true
# Save and load. A save *is* a snapshot here (ADR 0028's format), which is what makes it a text file
# a person can diff and an agent can read rather than an opaque blob.
amadeo-snapshot.workspace = true
amadeo-transform.workspace = true
# The interface (ADR 0062). This game is where a panel and a label were first drawn on a screen.
amadeo-ui.workspace = true

anyhow = "1"
winit = "0.30"

[lints]
workspace = true

[lib]
name = "atrium"
path = "src/lib.rs"

[[bin]]
name = "atrium"
path = "src/main.rs"

# Generates the `.wav` files in `assets/sounds/` from the descriptions in its own source. See its
# module docs for why a game's audio assets are derived from text rather than committed as blobs.
[[bin]]
name = "tone"
path = "src/bin/tone.rs"
