[package]
name = "amadeo-agent"
description = "The agent interface layer: schema description and world introspection, rendered as JSON."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `assets.list` reports the catalogue, which lives on the World as a Service. amadeo-assets sits
# below this crate in the dependency order (CLAUDE.md §4), so reading it here is with the grain.
amadeo-assets.workspace = true
# `audio.describe` answers "why is it silent", which is the audio half of `render.describe`. Reading
# the world rather than a backend is what makes it work against the real backend as well as the null
# one, so this dependency is the *abstraction* and never `kira` -- the feature stays off here.
amadeo-audio.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
amadeo-reflect.workspace = true
# `render.describe` answers "what is on screen" from the world -- M1 exit gate 2 requires it as the
# verification channel. `amadeo-render` sits below this crate, and without the `gpu` feature it
# brings nothing heavy.
amadeo-render.workspace = true
# `describe.example` renders a component the way a scene file spells it. Borrowed rather than
# reimplemented: two copies of the canonical form would drift, and I2 needs exactly one. Same
# reasoning that had amadeo-snapshot borrow `format_float`. amadeo-scene sits below this crate.
amadeo-scene.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Tests describe and inspect the engine's real components rather than invented ones.
amadeo-transform.workspace = true
