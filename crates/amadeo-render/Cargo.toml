[package]
name = "amadeo-render"
description = "Rendering abstraction for the Amadeo engine, with a required null backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amadeo-core.workspace = true
amadeo-ecs.workspace = true
amadeo-reflect.workspace = true
amadeo-transform.workspace = true
thiserror.workspace = true

# GPU backend dependencies, all optional. The abstraction and the null backend must build and test
# with no GPU and no window (invariant I7), and these add roughly 200 transitive crates -- so a
# headless build, CI, and every determinism test stay lean by simply not enabling `gpu`.
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "1", optional = true }
wgpu = { version = "30", optional = true }

[features]
default = []
# Enables the wgpu backend. Requires a GPU at runtime; the null backend remains available either way.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[lints]
workspace = true
