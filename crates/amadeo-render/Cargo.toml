[package]
name = "amadeo-render"
description = "Rendering abstraction for the Amadeo engine, with a required null backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amadeo-core.workspace = true
amadeo-ecs.workspace = true
