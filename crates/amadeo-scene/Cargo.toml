[package]
name = "amadeo-scene"
description = "The scene file format: the shared authoring surface Justin and Claude both write to."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amadeo-assets.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
amadeo-reflect.workspace = true
amadeo-transform.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Only for tests: loading a scene built from the engine's real components proves rather more than
# loading one built from test doubles. `amadeo-render` sits below `amadeo-scene` in the crate order,
# so this respects invariant I6.
amadeo-render.workspace = true
