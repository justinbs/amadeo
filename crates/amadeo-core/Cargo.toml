[package]
name = "amadeo-core"
description = "Foundational types for the Amadeo engine: ticks, deterministic RNG, stable hashing, ids."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# A proc-macro crate, so this is a compile-time tool rather than a runtime dependency. It depends on
# no engine crate, which is what lets the bottom of the graph re-export `#[derive(StableHash)]`
# without creating a cycle (invariant I6).
amadeo-derive.workspace = true
thiserror.workspace = true

[lints]
workspace = true
