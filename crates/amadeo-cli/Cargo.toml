[package]
name = "amadeo-cli"
description = "The `amadeo` command: scaffolding and formatting standalone, everything else by launching the game."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "amadeo"
path = "src/main.rs"

[dependencies]
amadeo-agent.workspace = true
# `amadeo import` writes the sidecars. The game reports where its asset directory is; the CLI is the
# side that touches the filesystem -- the same division `scene.check` uses.
amadeo-assets.workspace = true
amadeo-scene.workspace = true
# `import-gltf` reads the file and converts its rotations. Both are here rather than in the engine
# because the importer is a *tool*: the engine never links a glTF parser for the import path
# (ADR 0039).
amadeo-gltf.workspace = true
amadeo-transform.workspace = true
# `amadeo image` reads a capture back. Standalone like `fmt`, and here rather than in the engine for
# the same reason the glTF importer is: it is a tool that looks at a file the engine wrote.
amadeo-image.workspace = true

# `anyhow` is allowed here and in games only (CLAUDE.md section 6). A CLI's errors are printed and
# read, never matched on, so the typed-error discipline the library crates keep buys nothing here.
anyhow = "1"

[lints]
workspace = true
