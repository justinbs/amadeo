[package]
name = "amadeo-audio"
description = "Audio abstraction for the Amadeo engine, with a required null backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# A sound names its asset by declared id (ADR 0020), exactly as a sprite names its texture — so this
# crate is the layer that turns an id into something audible.
amadeo-assets.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
# A one-shot is an event, not a state (ADR 0059's named gap). `Event` requires `StableHash`, which is
# what puts the *decision* to play a footstep in the state hash while the playing stays out of it.
amadeo-events.workspace = true
amadeo-reflect.workspace = true
# For where a sound is and where the listener is. The only reason this crate sits at the transform
# layer rather than below it.
amadeo-transform.workspace = true
thiserror.workspace = true

# The real backend, optional. The abstraction and the null backend must build and test with no sound
# card (invariant I7), and this pulls in a device library and a mixer -- so a headless build and CI
# stay lean by simply not enabling `kira`. Exactly how `amadeo-render` treats `gpu`.
#
# `default-features = false` matters: kira's defaults pull in `symphonia` for mp3, ogg, vorbis and
# flac, and the engine decodes its own WAV (ADR 0059, `wav.rs`). Compressed audio is a later,
# deliberate decision rather than something to acquire by leaving a default on.
kira = { version = "0.12", default-features = false, features = [
    "cpal",
    "cpal-realtime",
], optional = true }

[features]
default = []
# Enables the kira backend. Requires an audio device at runtime; `NullAudio` remains available
# either way, and `KiraAudio::new` reports a missing device rather than panicking.
kira = ["dep:kira"]

[lints]
workspace = true
