[package]
name = "amadeo-ui"
description = "Retained-mode game UI for the Amadeo engine: anchors, flow layout, and text."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amadeo-core.workspace = true
# A font is an asset with a declared id (ADR 0020), like a texture or a sound.
amadeo-assets.workspace = true
amadeo-ecs.workspace = true
# The glyph atlas is a `TextureData` like any other, so it goes into `TextureCache` unchanged and a
# glyph is a `Sprite` with a region -- exactly what a tilesheet tile is (ADR 0023).
amadeo-image.workspace = true
amadeo-reflect.workspace = true
# A widget is drawn through the sprite path -- a panel is a quad and a glyph is a textured quad
# (ADR 0062), so `SortOrder` is what stacks UI over the world rather than a separate hierarchy.
amadeo-render.workspace = true
# A UI node sits in a parent, which is the same `Parent` every other hierarchy uses. Reusing it is
# what lets `propagate_transforms` and the editor's scene tree work on UI unchanged.
amadeo-transform.workspace = true
thiserror.workspace = true

# Text shaping, bidirectional text, line breaking and font fallback (ADR 0062).
#
# `default-features = false` is load-bearing rather than tidy. The defaults enable `fontconfig`,
# which reads the **operating system's** font database -- and a game whose text falls back to
# whatever fonts happen to be installed looks different on every machine. A game ships its fonts,
# so only `std` (the shaping stack) and `swash` (rasterising a glyph to pixels) are wanted.
cosmic-text = { version = "0.19", default-features = false, features = [
    "std",
    "swash",
] }

[lints]
workspace = true
