[package]
name = "amadeo-app"
description = "Fixed-timestep loop, system schedules, and app lifecycle for the Amadeo engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
amadeo-agent.workspace = true
# The asset catalogue is installed on the World before the first tick -- ADR 0021's load barrier.
amadeo-assets.workspace = true
# Reads glTF geometry for a `.mesh` asset that points into one (ADR 0039). Here rather than in
# amadeo-render because the *asset store* is what holds the bytes, and this is the layer that can
# see both it and MeshData.
amadeo-gltf.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
amadeo-events.workspace = true
amadeo-input.workspace = true
amadeo-reflect.workspace = true
# `render.capture` renders the world offscreen and writes a PNG. The dependency is unconditional --
# the *GPU* half is behind this crate.s `gpu` feature, so a game that never captures pays nothing.
amadeo-render.workspace = true
amadeo-scene.workspace = true
# Only so `load_scene` can fill the clip cache from the `.anim` files a scene names (ADR 0066). A
# `.anim` is a scene file and `amadeo-scene` sits above `amadeo-anim`, so the animation crate cannot
# parse its own asset -- the same split `Material`, `Environment` and `Theme` all have.
amadeo-anim.workspace = true
# ADR 0086: occlusion is a value written onto a voice from above, and this is the "above". Two edges
# rather than one because the question is "does a wall stand between this sound and the ears" -- it
# needs the audio components and the physics query, and neither of those crates may depend on the
# other (I6). This crate already carries render, anim, scene and snapshot for the same reason: it is
# where subsystems are wired to each other.
amadeo-audio.workspace = true
amadeo-physics.workspace = true
# `--snapshot` restores before the first tick, and `snapshot.take` captures.
amadeo-snapshot.workspace = true
# `render.capture --pitch/--yaw` aims the cameras and puts them back, which means writing a
# `Transform` and re-deriving `GlobalTransform`. **This was a dev-dependency until then**, on a
# comment saying it was not a real one -- which stopped being true the moment a protocol method
# needed to move an entity. No new edge in the graph: `amadeo-render` already depends on it.
amadeo-transform.workspace = true
thiserror.workspace = true

[features]
# Lets `render.capture` create an offscreen wgpu backend. Off by default so a headless build -- a
# dedicated server, a CI runner -- does not link a graphics stack it will never use (I7).
gpu = ["amadeo-render/gpu"]

[lints]
workspace = true

[dev-dependencies]
amadeo-input.workspace = true
