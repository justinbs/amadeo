[workspace]
resolver = "3"
# `modules/*` is the optional, genre-flavoured layer CLAUDE.md section 4 reserves. It sits ABOVE
# every crate: a module may depend on engine crates and on other modules, and **no engine crate may
# ever depend on a module** (invariant I6, one level up). ADR 0037 created the layer.
members = ["crates/*", "modules/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/justinbs/amadeo"
rust-version = "1.97"

[workspace.dependencies]
# Internal crates, in dependency order (see CLAUDE.md section 4). Entries are added here as each
# crate is created, so this list doubles as a record of what exists.
# Proc-macro crate. Depends on no engine crate, so it sits below even amadeo-core and cannot
# create a cycle (invariant I6) despite amadeo-core re-exporting one of its macros.
amadeo-derive = { path = "crates/amadeo-derive", version = "0.1.0" }
# Also depends on no engine crate: it knows about image *files* and nothing about worlds or
# rendering, so it sits beside amadeo-derive at the bottom of the graph (ADR 0026).
amadeo-image = { path = "crates/amadeo-image", version = "0.1.0" }
# Also no engine deps, for the same reason amadeo-image has none: it holds the glTF parser and
# nothing else, so no `gltf::` type is visible above it (ADR 0039).
amadeo-gltf = { path = "crates/amadeo-gltf", version = "0.1.0" }
# Background work. No engine deps and no external ones either -- a job pool is std::thread, a
# channel and a mutex, and ADR 0041 explains why a work-stealing runtime does not belong under the
# one thing that must be reproducible.
amadeo-jobs = { path = "crates/amadeo-jobs", version = "0.1.0" }
# Deterministic gradient noise (ADR 0044). No deps, and its own crate rather than part of
# amadeo-voxel so that a 2D game can have a heightmap without depending on a 3D mesher -- trap 9.
amadeo-noise = { path = "crates/amadeo-noise", version = "0.1.0" }
# Signed-distance fields and surface-nets meshing (ADR 0042). No deps: it is a function from a
# field to a mesh and knows nothing about worlds, assets or rendering.
amadeo-voxel = { path = "crates/amadeo-voxel", version = "0.1.0" }
# Chunked streaming (ADR 0043). Depends on amadeo-voxel and amadeo-jobs and nothing else: the hard
# part of streaming is *when* work happens, and none of it needs a World, a renderer or a solver --
# so the claim that thread count cannot reach the answer is testable with no engine at all.
amadeo-terrain = { path = "crates/amadeo-terrain", version = "0.1.0" }
amadeo-core = { path = "crates/amadeo-core", version = "0.1.0" }
amadeo-reflect = { path = "crates/amadeo-reflect", version = "0.1.0" }
amadeo-ecs = { path = "crates/amadeo-ecs", version = "0.1.0" }
amadeo-transform = { path = "crates/amadeo-transform", version = "0.1.0" }
amadeo-assets = { path = "crates/amadeo-assets", version = "0.1.0" }
amadeo-events = { path = "crates/amadeo-events", version = "0.1.0" }
amadeo-input = { path = "crates/amadeo-input", version = "0.1.0" }
amadeo-render = { path = "crates/amadeo-render", version = "0.1.0" }
# Beside amadeo-render rather than above it: physics needs transforms and nothing the renderer has,
# and the renderer needs nothing physics has. Both sit below amadeo-scene (ADR 0015's correction).
amadeo-physics = { path = "crates/amadeo-physics", version = "0.1.0" }
# Beside those two for the same reason (ADR 0059): audio needs transforms, to place a sound in the
# world and a listener to hear it, and nothing else at this layer needs anything audio has.
amadeo-audio = { path = "crates/amadeo-audio", version = "0.1.0" }
# Retained-mode game UI (ADR 0062). ABOVE amadeo-render, unlike the three above it, because a widget
# is drawn through the sprite path and a glyph is a textured quad -- it needs what the renderer has.
# Still below amadeo-scene, because authoring a menu in a `.scene` file is that crate's business.
amadeo-ui = { path = "crates/amadeo-ui", version = "0.1.0" }
amadeo-scene = { path = "crates/amadeo-scene", version = "0.1.0" }
# Above amadeo-scene, because it borrows that crate's scalar encoding (ADR 0028).
amadeo-snapshot = { path = "crates/amadeo-snapshot", version = "0.1.0" }
amadeo-agent = { path = "crates/amadeo-agent", version = "0.1.0" }
amadeo-app = { path = "crates/amadeo-app", version = "0.1.0" }
amadeo-cli = { path = "crates/amadeo-cli", version = "0.1.0" }

# Modules -- the optional layer above every crate (ADR 0037). Listed after the engine, and nothing
# above is allowed to appear in an engine crate's dependencies.
amadeo-character = { path = "modules/amadeo-character", version = "0.1.0" }
# A third-person follow camera. Deliberately does not depend on amadeo-character: trap 10 says a
# camera rig must not assume a character exists, and this follows a `Parent`, whatever that is.
amadeo-camera = { path = "modules/amadeo-camera", version = "0.1.0" }

# External.
thiserror = "2"

# Lints applied to every crate in the workspace via `[lints] workspace = true`.
#
# `unsafe_code = "forbid"` is an architectural commitment, not a style preference:
# ADR 0008 chose a safe ECS storage design specifically so this could hold in the
# engine's most-read crate. Lifting it anywhere needs an ADR.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Correctness and clarity. Deliberately not a maximalist lint set --
# noisy lints get ignored, and ignored lints are worse than absent ones.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Not configured here: a lint banning HashMap/HashSet in simulation paths (invariant I3).
# clippy's `disallowed_types` is crate-global, and HashMap is perfectly fine outside the
# deterministic zone, so a blanket warning would be noise that gets ignored. The real guard is
# the golden replay tests, which fail loudly on any nondeterminism. Revisit if a path-scoped
# lint becomes available.

[profile.dev]
# Engine dev builds are run, not just compiled, so a little optimisation in
# dependencies pays for itself. Our own crates stay unoptimised for fast rebuilds.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
