[package]
name = "amadeo-interaction"
description = "Looking at things and using them. A module, not engine core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# A module may depend on any engine crate. The reverse is forbidden -- see ADR 0037 and invariant I6.
amadeo-app.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
# Choosing to use something is a past-tense fact a game acts on, not a callback.
amadeo-events.workspace = true
amadeo-input.workspace = true
# `cast_shape` is the whole mechanism (ADR 0054), and it reports *what* it hit.
amadeo-physics.workspace = true
amadeo-reflect.workspace = true
amadeo-transform.workspace = true

[lints]
workspace = true

[features]
# Passed through so a game asks for the real solver in one place. Off by default, which means a
# headless test of this module casts against `NullPhysics` and finds nothing -- deliberately the
# control case, the same trade `modules/amadeo-character` makes.
rapier = ["amadeo-physics/rapier"]
