[package]
name = "amadeo-inventory"
description = "Items, stacks and containers. A module, not engine core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# A module may depend on any engine crate. The reverse is forbidden -- see ADR 0037 and invariant I6.
amadeo-app.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
# Picking something up and dropping it are past-tense facts a game acts on, not callbacks.
amadeo-events.workspace = true
amadeo-reflect.workspace = true
# The whole mechanism (ADR 0070): storing an item removes its `Transform`, which is what every world
# pass requires, so an item in a bag is invisible to rendering, physics and propagation for free.
amadeo-transform.workspace = true
# `thiserror` for a library crate, per CLAUDE.md section 6.
thiserror.workspace = true

[lints]
workspace = true
