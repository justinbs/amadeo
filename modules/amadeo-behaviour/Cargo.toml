[package]
name = "amadeo-behaviour"
description = "AI as a state machine over named facts. A module, not engine core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# A module may depend on any engine crate. The reverse is forbidden -- see ADR 0037 and invariant I6.
amadeo-app.workspace = true
amadeo-core.workspace = true
amadeo-ecs.workspace = true
# Entering and leaving a state is a past-tense fact a game acts on, not a callback (ADR 0068 §3).
amadeo-events.workspace = true
amadeo-reflect.workspace = true

[lints]
workspace = true
